name: Sync TikZ Editor Embed with Host

on:
  workflow_dispatch:
    inputs:
      tikz_editor_ref:
        description: Upstream DominikPeters/tikz-editor ref to build
        required: false
        default: master
      release_tag:
        description: Optional release tag (leave empty to generate a versioned sync tag)
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tikz-editor-embed-sync
  cancel-in-progress: true

env:
  TIKZ_EDITOR_REF: ${{ github.event.inputs.tikz_editor_ref || 'master' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mirror dependencies
        run: npm install

      - name: Build embed from upstream
        run: npm run build

      - name: Sync generated folders to repository root
        run: |
          rm -rf tikz-editor host
          cp -R dist/site/tikz-editor ./tikz-editor
          cp -R dist/site/host ./host
          cp dist/site/README.txt ./tikz-editor/README.txt
          cp dist/site/.nojekyll ./.nojekyll

      - name: Verify
        run: |
          test -f "tikz-editor/index.html" || (echo "MISSING: tikz-editor/index.html" && exit 1)
          test -f "host/index.html" || (echo "MISSING: host/index.html" && exit 1)
          test -f ".nojekyll" || (echo "MISSING: .nojekyll" && exit 1)
          echo "✓ tikz-editor ready ($(find tikz-editor -type f | wc -l) files)"
          echo "✓ host ready ($(find host -type f | wc -l) files)"

      - name: Commit generated embed folders
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tikz-editor/ host/ .nojekyll
          git diff --staged --quiet || git commit -m "Update TikZ editor embed $(date +%Y-%m-%d)"
          git push

      - name: Resolve archive and release tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${REQUESTED_TAG:-v$(node -p "require('./package.json').version")-sync.${GITHUB_RUN_NUMBER}}"
            if [[ ! "$TAG" =~ ^v[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
              echo "::error::Invalid release tag: $TAG"
              exit 1
            fi
          else
            TAG="preview-${GITHUB_SHA::7}"
          fi
          echo "ARCHIVE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create release zip
        run: |
          cd dist/site
          zip -r "../tikz-editor-embed-${ARCHIVE_TAG}.zip" tikz-editor host README.txt .nojekyll
          echo "ZIP_PATH=dist/tikz-editor-embed-${ARCHIVE_TAG}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tikz-editor-embed
          path: |
            dist/site
            ${{ env.ZIP_PATH }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag and publish manual sync release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$ARCHIVE_TAG" > /dev/null; then
            echo "::error::Release tag already exists: $ARCHIVE_TAG"
            exit 1
          fi
          # Tag the generated-assets commit, not the commit initially checked out.
          git tag "$ARCHIVE_TAG" HEAD
          git push origin "refs/tags/$ARCHIVE_TAG"
          gh release create "$ARCHIVE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ARCHIVE_TAG" \
            --notes "Static TikZ editor embed asset for TeXlyre. Built from DominikPeters/tikz-editor ref: ${TIKZ_EDITOR_REF}."
